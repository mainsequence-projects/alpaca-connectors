api_version: 2.3.0
name: alpaca-connectors-api
resources:
- key: alpaca-connectors-api
  kind: fastapi
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: ALPACA_CONNECTORS_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
- key: alpaca-connectors-migrate
  kind: job
  spec:
    name: Alpaca Connectors Migrations
    description: Apply the alpaca_connectors MetaTable schema revisions before the API rolls out (ADR 0012).
    execution_path: src/jobs/migrate_alpaca_connectors.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
# One shared Job per configuration kind (ADR 0013). The API starts a manual run with
# `--configuration-uid <uid>`; the scheduled run (`--scheduled`) starts one such run for every
# configuration whose scheduled flag is set. No step references them, so a push promotes their
# image without waiting for the migration; their launchers' schema gate (ADR 0012) covers that gap.
# A push re-applies the declared schedule. Both run after the 00:00 UTC daily bars Job.
- key: alpaca-etf-signal
  kind: job
  spec:
    name: Alpaca ETF Signal
    description: Run one ETF signal configuration (--configuration-uid) or start a run per scheduled one (--scheduled).
    execution_path: src/jobs/run_alpaca_etf_signal.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 0 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: alpaca-etf-portfolio
  kind: job
  spec:
    name: Alpaca ETF Portfolio
    description: Run one ETF portfolio configuration (--configuration-uid) or start a run per scheduled one (--scheduled).
    execution_path: src/jobs/run_alpaca_etf_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 2 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
execution:
  steps:
    image:
      prepare_image: alpaca-connectors-api
    migrate:
      run_job: alpaca-connectors-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: alpaca-connectors-api
      image_from: image
      needs: [migrate]
