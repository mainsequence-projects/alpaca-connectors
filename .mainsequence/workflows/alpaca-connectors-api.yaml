api_version: 2.3.0
name: alpaca-connectors-api
resources:
- key: alpaca-connectors-api
  kind: fastapi
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: ALPACA_CONNECTORS_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
- key: alpaca-connectors-migrate
  kind: job
  spec:
    name: Alpaca Connectors Migrations
    description: Apply the alpaca_connectors MetaTable schema revisions before the API rolls out (ADR 0012).
    execution_path: src/jobs/migrate_alpaca_connectors.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
execution:
  steps:
    image:
      prepare_image: alpaca-connectors-api
    migrate:
      run_job: alpaca-connectors-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: alpaca-connectors-api
      image_from: image
      needs: [migrate]
