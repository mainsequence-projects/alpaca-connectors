api_version: "3.0.0"
name: alpaca-connectors-api
resources:
# The key is also the Agent's MCP tool prefix (`alpaca__list_tools`, `alpaca__call_tool`), so it
# must match ^[a-z][a-z0-9_]{0,39}$ (ADR 0015). The Alpaca site names this release by this key.
- key: alpaca
  kind: fastapi
  # The API's own workload User. `access.resources` can name only this file's resources, and the
  # API also runs `alpaca-bars-update` (operations/bar_updates.py), which alpaca-bars-update.yaml
  # declares; no branch policy smaller than `editor` runs a Job, so the branch entry stays until
  # that Job is declared here. The resource entries are what the API needs on its own: `runner`
  # on the portfolio Job it lists and starts, `viewer` on its dispatcher, whose schedule the
  # configuration responses report (operations/configuration_jobs.py), and `user` on the Agent,
  # which the project configuration finds and returns to the site (site_agent.py).
  # Every MetaTable is read through the MetaTables API on the MetaTables repository's branch.
  # Markets registries, holdings and asset snapshots are reached through the Markets API
  # (ms-markets ADR 0047), found with `reader` on the MainSequenceMarkets branch; the API holds no
  # role on `mainsequence.markets`. Every resource below that calls Markets declares the same.
  # The order-execution routes (ADR 0016) are for applications in other repositories, such as the
  # Hunch release: each declares `user` on this release from its own workflow
  # (`access.branches: [{repository: <this repository>, policy: user}]`); nothing is declared here
  # for a caller, and whose Account a caller may trade is that application's decision.
  # Reading the ALPACA_CONNECTORS_DATA_KEY Secret lets the API seal and open the account keys it
  # stores in the encrypted columns of the account table (ADR 0017); the Secret holds a keyring
  # created with `metatables encryption new-keyring`, never a key value.
  access:
    branch: editor
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: alpaca-connectors-agent
      policy: user
    - key: alpaca-portfolio
      policy: runner
    - key: alpaca-portfolio-dispatcher
      policy: viewer
    secrets:
    - name: ALPACA_CONNECTORS_DATA_KEY
      policy: value_reader
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    mcp_enabled: true
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: ALPACA_CONNECTORS_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
    # Where people enter Alpaca keys for the Agent's account key requests: the Alpaca site's
    # Command Center link in this Environment.
    - name: ALPACA_CONNECTORS_SITE_URL
      value: http://localhost:5173/app/links/1b572c68-e4f5-4589-b17c-23d12f474130
    # The callers trusted to name an external person in the caller context, and the gateways
    # each may vouch for (ADR 0019): a JSON list of {caller_uid, segment, gateway_uids}. An entry
    # is added only once that caller meets ADR 0019 section 9; a malformed value stops the API
    # from starting, and the previous revision keeps serving.
    - name: ALPACA_CONNECTORS_VOUCHING_CALLERS
      value: "[]"
# The branch's one Harness Agent. It reaches every project tool through the `alpaca` API's MCP and
# acts for the person whose request it serves (only an Organization admin's push enables this).
# `user` on the API covers its own calls to the API's MCP; delegated calls use the person's access.
# It reads no tables itself, so it needs no MetaTables access and is not a member of the table Team.
- key: alpaca-connectors-agent
  kind: harness_agent
  acts_for_requester: true
  access:
    resources:
    - key: alpaca
      policy: user
  spec:
    source_path: api/agent/main.py
    command_center_icon:
      path: assets/agents/sequence/assets/alpaca/neutral/idle.png
      rendering: color
      image_rendering: auto
    command_center_animations:
      poses:
        thinking: {path: assets/agents/sequence/assets/alpaca/neutral/thinking.png}
        working: {path: assets/agents/sequence/assets/alpaca/neutral/working.png}
        error: {path: assets/agents/sequence/assets/alpaca/neutral/error.png}
      tools:
        - application: alpaca
          pose: working
    llm_provider: openai-codex
    llm_model: gpt-5.6-luna
    llm_thinking: medium
    mcp_applications:
    - resource: alpaca
    # Only Alpaca application tools; TAU retains skill-scoped reading and A2A Task controls.
    env_vars:
    - name: TAU_EXCLUDE_BASE_TOOLS
      value: 'true'
    - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
      value: 'true'
    cpu_request: 250m
    memory_request: 512Mi
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
- key: alpaca-connectors-migrate
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Alpaca Connectors Migrations
    description: Apply the alpaca_connectors MetaTable schema revisions before the API rolls out (ADR 0012).
    execution_path: src/jobs/migrate_alpaca_connectors.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
# One shared Job per configuration kind (ADR 0013); portfolios are the one kind (ADR 0027). The
# API, the CLI and the kind's dispatcher below start a run with `--configuration-uid <uid>`. The Job
# has no schedule: the scheduled run starts runs of the kind's Job, and a Job cannot declare access
# to itself. No step references it, so a push promotes its image without waiting for the
# migration; its launcher's schema gate (ADR 0012) covers that gap.
- key: alpaca-portfolio
  kind: job
  # A run first fetches the bars its signal needs with its account's stored keys (issue #39,
  # ADR 0017), so it reads the keyring Secret as the bars Job does.
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    secrets:
    - name: ALPACA_CONNECTORS_DATA_KEY
      policy: value_reader
  spec:
    name: Alpaca Portfolio
    description: Run one portfolio configuration (--configuration-uid).
    execution_path: src/jobs/run_alpaca_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The kind's daily scheduled run (ADR 0013). The dispatcher's scheduled run (`--scheduled`) reads
# the scheduled configurations and starts one run of the portfolio Job per configuration, through
# `runner` on that Job (operations/configuration_jobs.py). A push re-applies the declared schedule.
# It runs after the US equity close and after the 00:00 UTC bars update.
- key: alpaca-portfolio-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: alpaca-portfolio
      policy: runner
  spec:
    name: Alpaca Portfolio Dispatcher
    description: Start one Alpaca Portfolio run per scheduled portfolio configuration (--scheduled).
    execution_path: src/jobs/dispatch_alpaca_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 2 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The account and portfolio life cycle, run on demand inside the platform (ADR 0032). It has no
# schedule and is no step of the execution graph, so a push never runs it. It calls this branch's
# API as its own workload (`user` on `alpaca`, which only this file can name) and Markets as every
# Job does, and reads the paper account's keys from the two Secrets; it sends them only to the
# account create route and to Alpaca. The API starts its portfolio Job runs, so it holds no
# `runner` itself.
- key: alpaca-lifecycle-check
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: alpaca
      policy: user
    secrets:
    - name: ALPACA_PAPER_API_KEY
      policy: value_reader
    - name: ALPACA_PAPER_SECRET_KEY
      policy: value_reader
  spec:
    name: Alpaca Lifecycle Check
    description: Run the account and portfolio life cycle against this branch's API and print the timed report.
    execution_path: src/jobs/run_lifecycle_check.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The migration Job runs from the API's candidate image. The API deploys only after it succeeds,
# and the Agent deploys from its own image only after the API whose MCP it uses.
execution:
  steps:
    image:
      prepare_image: alpaca
    migrate:
      run_job: alpaca-connectors-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: alpaca
      image_from: image
      needs: [migrate]
    agent_image:
      prepare_image: alpaca-connectors-agent
    deploy_agent:
      deploy: alpaca-connectors-agent
      image_from: agent_image
      needs: [deploy_api, agent_image]
