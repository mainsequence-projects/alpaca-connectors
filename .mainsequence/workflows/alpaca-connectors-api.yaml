api_version: 2.3.0
name: alpaca-connectors-api
resources:
# The key is also the Agent's MCP tool prefix (`alpaca__list_tools`, `alpaca__call_tool`), so it
# must match ^[a-z][a-z0-9_]{0,39}$ (ADR 0015). The Alpaca site names this release by this key.
- key: alpaca
  kind: fastapi
  # The API's own workload User: running this branch's Jobs needs edit, and every MetaTable is
  # read through the MetaTables API on the MetaTables repository's branch.
  access:
    branch: edit
    branches:
    - repository: MetaTables
      level: view
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    mcp_enabled: true
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: ALPACA_CONNECTORS_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
    # Where people enter Alpaca keys for the Agent's account key requests: the Alpaca site's
    # Command Center link in this Environment.
    - name: ALPACA_CONNECTORS_SITE_URL
      value: http://localhost:5173/app/links/1b572c68-e4f5-4589-b17c-23d12f474130
# The branch's one Harness Agent. It reaches every project tool through the `alpaca` API's MCP and
# acts for the person whose request it serves (only an Organization admin's push enables this).
- key: alpaca-connectors-agent
  kind: harness_agent
  acts_for_requester: true
  spec:
    source_path: api/agent/main.py
    llm_provider: openai
    llm_model: gpt-5.4
    llm_thinking: medium
    mcp_applications:
    - resource: alpaca
    cpu_request: 250m
    memory_request: 512Mi
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
- key: alpaca-connectors-migrate
  kind: job
  spec:
    name: Alpaca Connectors Migrations
    description: Apply the alpaca_connectors MetaTable schema revisions before the API rolls out (ADR 0012).
    execution_path: src/jobs/migrate_alpaca_connectors.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
# One shared Job per configuration kind (ADR 0013). The API starts a manual run with
# `--configuration-uid <uid>`; the scheduled run (`--scheduled`) starts one such run for every
# configuration whose scheduled flag is set. No step references them, so a push promotes their
# image without waiting for the migration; their launchers' schema gate (ADR 0012) covers that gap.
# A push re-applies the declared schedule. Both run after the 00:00 UTC daily bars Job.
- key: alpaca-etf-signal
  kind: job
  spec:
    name: Alpaca ETF Signal
    description: Run one ETF signal configuration (--configuration-uid) or start a run per scheduled one (--scheduled).
    execution_path: src/jobs/run_alpaca_etf_signal.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 0 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: alpaca-etf-portfolio
  kind: job
  spec:
    name: Alpaca ETF Portfolio
    description: Run one ETF portfolio configuration (--configuration-uid) or start a run per scheduled one (--scheduled).
    execution_path: src/jobs/run_alpaca_etf_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 2 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
execution:
  steps:
    image:
      prepare_image: alpaca
    migrate:
      run_job: alpaca-connectors-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: alpaca
      image_from: image
      needs: [migrate]
