api_version: "3.0.0"
name: alpaca-connectors-api
resources:
# The key is also the Agent's MCP tool prefix (`alpaca__list_tools`, `alpaca__call_tool`), so it
# must match ^[a-z][a-z0-9_]{0,39}$ (ADR 0015). The Alpaca site names this release by this key.
- key: alpaca
  kind: fastapi
  # The API's own workload User. `access.resources` can name only this file's resources, and the
  # API also runs `alpaca-bars-update` (operations/bar_updates.py), which alpaca-bars-update.yaml
  # declares; no branch policy smaller than `editor` runs a Job, so the branch entry stays until
  # that Job is declared here. The resource entries are what the API needs on its own: `runner`
  # on the signal and portfolio Jobs it lists and starts, `viewer` on their dispatchers, whose
  # schedule the configuration responses report (operations/configuration_jobs.py), and `user` on
  # the Agent, which the project configuration finds and returns to the site (site_agent.py).
  # Every MetaTable is read through the MetaTables API on the MetaTables repository's branch.
  access:
    branch: editor
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: alpaca-connectors-agent
      policy: user
    - key: alpaca-etf-signal
      policy: runner
    - key: alpaca-etf-portfolio
      policy: runner
    - key: alpaca-etf-signal-dispatcher
      policy: viewer
    - key: alpaca-etf-portfolio-dispatcher
      policy: viewer
  spec:
    source_path: api/app/main.py
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    mcp_enabled: true
    cors_allowed_origins:
    - https://*.site-dev.main-sequence.app
    env_vars:
    - name: ALPACA_CONNECTORS_CORS_ORIGINS
      value: https://*.site-dev.main-sequence.app
    # Where people enter Alpaca keys for the Agent's account key requests: the Alpaca site's
    # Command Center link in this Environment.
    - name: ALPACA_CONNECTORS_SITE_URL
      value: http://localhost:5173/app/links/1b572c68-e4f5-4589-b17c-23d12f474130
# The branch's one Harness Agent. It reaches every project tool through the `alpaca` API's MCP and
# acts for the person whose request it serves (only an Organization admin's push enables this).
# `user` on the API covers its own calls to the API's MCP; delegated calls use the person's access.
# It reads no tables itself, so it needs no MetaTables access and is not a member of the table Team.
- key: alpaca-connectors-agent
  kind: harness_agent
  acts_for_requester: true
  access:
    resources:
    - key: alpaca
      policy: user
  spec:
    source_path: api/agent/main.py
    command_center_icon:
      path: assets/agents/packer/idle.png
      rendering: color
      image_rendering: pixelated
    command_center_animations:
      poses:
        thinking: {path: assets/agents/packer/thinking.png}
        working: {path: assets/agents/packer/working.png}
        trading: {path: assets/agents/packer/trading.png}
        error: {path: assets/agents/packer/error.png}
      tools:
        - application: alpaca
          pose: trading
    llm_provider: openai-codex
    llm_model: gpt-5.6-luna
    llm_thinking: medium
    mcp_applications:
    - resource: alpaca
    # Only Alpaca application tools; TAU retains skill-scoped reading and A2A Task controls.
    env_vars:
    - name: TAU_EXCLUDE_BASE_TOOLS
      value: 'true'
    - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
      value: 'true'
    cpu_request: 250m
    memory_request: 512Mi
    automatic_deployment: true
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
- key: alpaca-connectors-migrate
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Alpaca Connectors Migrations
    description: Apply the alpaca_connectors MetaTable schema revisions before the API rolls out (ADR 0012).
    execution_path: src/jobs/migrate_alpaca_connectors.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 1800
    spot: false
    automatic_redeployment:
      enabled: true
      tag_regex: null
# One shared Job per configuration kind (ADR 0013). The API, the CLI and the kind's dispatcher
# below start a run with `--configuration-uid <uid>`. These Jobs have no schedule: the scheduled
# run starts runs of the kind's Job, and a Job cannot declare access to itself. A push changes only
# the fields a declaration states, so `task_schedule: null` and the empty `scheduled_command_args`
# remove the schedule earlier pushes set. No step references the four Jobs, so a push promotes
# their image without waiting for the migration; their launchers' schema gate (ADR 0012) covers
# that gap.
- key: alpaca-etf-signal
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Alpaca ETF Signal
    description: Run one ETF signal configuration (--configuration-uid).
    execution_path: src/jobs/run_alpaca_etf_signal.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: alpaca-etf-portfolio
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
  spec:
    name: Alpaca ETF Portfolio
    description: Run one ETF portfolio configuration (--configuration-uid).
    execution_path: src/jobs/run_alpaca_etf_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule: null
    scheduled_command_args: []
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The kinds' daily scheduled runs (ADR 0013). Each dispatcher's scheduled run (`--scheduled`) reads
# the scheduled configurations and starts one run of its kind's Job per configuration, through
# `runner` on that Job (operations/configuration_jobs.py). A push re-applies the declared schedule.
# Both run after the 00:00 UTC daily bars Job.
- key: alpaca-etf-signal-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: alpaca-etf-signal
      policy: runner
  spec:
    name: Alpaca ETF Signal Dispatcher
    description: Start one Alpaca ETF Signal run per scheduled signal configuration (--scheduled).
    execution_path: src/jobs/dispatch_alpaca_etf_signal.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '30 0 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
- key: alpaca-etf-portfolio-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    resources:
    - key: alpaca-etf-portfolio
      policy: runner
  spec:
    name: Alpaca ETF Portfolio Dispatcher
    description: Start one Alpaca ETF Portfolio run per scheduled portfolio configuration (--scheduled).
    execution_path: src/jobs/dispatch_alpaca_etf_portfolio.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 2 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
# The migration Job runs from the API's candidate image. The API deploys only after it succeeds,
# and the Agent deploys from its own image only after the API whose MCP it uses.
execution:
  steps:
    image:
      prepare_image: alpaca
    migrate:
      run_job: alpaca-connectors-migrate
      image_from: image
      needs: [image]
    deploy_api:
      deploy: alpaca
      image_from: image
      needs: [migrate]
    agent_image:
      prepare_image: alpaca-connectors-agent
    deploy_agent:
      deploy: alpaca-connectors-agent
      image_from: agent_image
      needs: [deploy_api, agent_image]
