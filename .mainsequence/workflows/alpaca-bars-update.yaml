api_version: "3.0.0"
name: alpaca-connectors-market-data
resources:
- key: alpaca-bars-update
  kind: job
  # Opens the configuration account's stored keys to call Alpaca (ADR 0017).
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    secrets:
    - name: ALPACA_CONNECTORS_DATA_KEY
      policy: value_reader
  spec:
    name: Alpaca Bars Update
    description: Execute one enabled stored Alpaca bar configuration selected by a per-run configuration_uid argument.
    execution_path: src/jobs/run_alpaca_bars_update.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    # Follows main like the API's Jobs: a pinned image kept running the pre-ADR 0017 code, which
    # reads account keys from platform Secrets that the encrypted columns replaced.
    automatic_redeployment:
      enabled: true
      tag_regex: null
# Redeployed on 2026-11-04 so the Job leaves the pre-ADR-0017 image it was pinned to.
