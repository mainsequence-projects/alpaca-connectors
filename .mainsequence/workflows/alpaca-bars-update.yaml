api_version: "3.0.0"
name: alpaca-connectors-market-data
resources:
- key: alpaca-bars-update
  kind: job
  # Opens the configuration account's stored keys to call Alpaca (ADR 0017).
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    secrets:
    - name: ALPACA_CONNECTORS_DATA_KEY
      policy: value_reader
  spec:
    name: Alpaca Bars Update
    description: Execute one enabled stored Alpaca bar configuration selected by a per-run configuration_uid argument.
    execution_path: src/jobs/run_alpaca_bars_update.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    # Follows main like the API's Jobs: a pinned image kept running the pre-ADR 0017 code, which
    # reads account keys from platform Secrets that the encrypted columns replaced.
    automatic_redeployment:
      enabled: true
      tag_regex: null
# Redeployed on 2026-11-04 so the Job leaves the pre-ADR-0017 image it was pinned to.
#
# The daily bars update (ADR 0021). Its scheduled run (`--scheduled`) reads the enabled bar
# configurations and starts one `alpaca-bars-update` run per configuration, through `runner` on that
# Job (operations/bar_updates.py); a Job cannot declare access to itself, and `access.resources`
# names only this file's resources, so the dispatcher lives here. 00:00 UTC is the first run whose
# daily cutoff includes the session that just closed; it precedes the 00:30 signal and 02:00
# portfolio dispatchers. It opens no account keys, so it declares no Secret.
- key: alpaca-bars-update-dispatcher
  kind: job
  access:
    branches:
    - repository: MetaTables
      policy: reader
    - repository: MainSequenceMarkets
      policy: reader
    resources:
    - key: alpaca-bars-update
      policy: runner
  spec:
    name: Alpaca Bars Update Dispatcher
    description: Start one Alpaca Bars Update run per enabled stored bar configuration (--scheduled).
    execution_path: src/jobs/dispatch_alpaca_bars_update.py
    cpu_request: '0.25'
    memory_request: '0.5'
    max_runtime_seconds: 3600
    spot: false
    task_schedule:
      schedule:
        type: crontab
        expression: '0 0 * * *'
        timezone: UTC
    scheduled_command_args: ['--scheduled']
    automatic_redeployment:
      enabled: true
      tag_regex: null
