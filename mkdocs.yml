site_name: Alpaca Connectors
site_description: MainSequence Alpaca US equity registration, holdings extraction, and bars publishing.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight

nav:
  - Overview: index.md
  - Agentic Capabilities: agent.md
  - API: api.md
  - Command Center:
      - Asset Registry AppComponent: command_center/app_component.md
  - ETF Extraction:
      - Architecture: etf_extraction.md
  - Architecture:
      - ms-markets Currency Pair Asset Model: adr_ms_markets_asset_currency_pair_model.md
      - ETF Holdings AssetCategory Ownership: adr_etf_holdings_asset_category_ownership.md
  - Assets:
      - Registration Flow: assets/registration.md
      - Holdings Categories: assets/holdings_categories.md
      - Extractors: assets/extractors.md
  - Data Publishing:
      - Alpaca Daily Bars: data_nodes/alpaca_bars.md
  - Operations:
      - Jobs And Scheduling: operations/jobs.md
      - Development Workflow: operations/development.md
